version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: asistencias_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistencias_nsr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: asistencias_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@db:5432/asistencias_nsr
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TZ: America/Lima
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: asistencias_pwa
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
